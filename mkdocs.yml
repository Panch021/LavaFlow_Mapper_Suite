site_name: LavaFlow Mapper Suite
site_description: Near-real-time mapping and monitoring of active lava flows from NASA/FIRMS thermal anomalies
site_author: Francisco J. Vasconez
repo_url: https://github.com/Panch021/LavaFlow_Mapper_Suite
edit_uri: edit/main/docs/
copyright: GPL-3.0 · Instituto Geofísico – Escuela Politécnica Nacional

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed: {alternate_style: true}

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
  - User guide:
      - Workflow and tabs: user-guide.md
      - Configuration file: configuration.md
      - Output files: outputs.md
      - Methodology: methodology.md
      - Troubleshooting: troubleshooting.md
  - Development:
      - Architecture: architecture.md
      - Testing: testing.md
      - Contributing: contributing.md
      - Changelog: changelog.md
